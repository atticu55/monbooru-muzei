plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'boo.komori.wallpaper'
    compileSdk 35

    signingConfigs {
        // Persistent signing identity: one key across every build so new
        // versions install over old ones and Muzei keeps its selection.
        komori {
            storeFile rootProject.file('komori-debug.keystore')
            storePassword System.getenv('KOMORI_STORE_PASS') ?: 'komori-wallpaper'
            keyAlias 'komori'
            keyPassword System.getenv('KOMORI_STORE_PASS') ?: 'komori-wallpaper'
        }
    }

    defaultConfig {
        applicationId "boo.komori.wallpaper"
        minSdk 29
        targetSdk 35
        versionCode 13
        versionName "1.9.3"
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.komori
        }
        release {
            signingConfig signingConfigs.komori
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.work:work-runtime-ktx:2.10.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.google.android.apps.muzei:muzei-api:3.4.2'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
